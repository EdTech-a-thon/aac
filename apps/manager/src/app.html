<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#123C5E" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&amp;display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Cloudflare Web Analytics. PUBLIC_CF_BEACON_TOKEN is set only on the
		     production Vercel environment, so local and preview builds don't count visits. -->
		<script>
			{
				const token = '%sveltekit.env.PUBLIC_CF_BEACON_TOKEN%';
				if (token) {
					const beacon = document.createElement('script');
					beacon.type = 'module';
					beacon.dataset.cfBeacon = JSON.stringify({ token });
					beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
					document.body.append(beacon);
				}
			}
		</script>
	</body>
</html>
